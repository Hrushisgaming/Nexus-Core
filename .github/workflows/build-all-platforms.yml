name: Build Multi-Platform Installers

# All-in-one: runs the Windows, macOS and Linux workflows together and bundles the three
# downloads into one artifact (NexusCore-All-Platforms). Each OS also has its own workflow
# (build-windows.yml, build-macos.yml, build-linux.yml) if you only need one.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - refactor/macos-stability-and-storage
    tags:
      - 'v*'

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
  macos:
    uses: ./.github/workflows/build-macos.yml
  linux:
    uses: ./.github/workflows/build-linux.yml

  bundle:
    name: Bundle all platforms into one download
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle
      - name: List what was built
        run: find bundle -type f -exec ls -lh {} \;
      - name: Package
        run: |
          cd bundle
          zip -r ../NexusCore-All-Platforms.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: NexusCore-All-Platforms
          path: NexusCore-All-Platforms.zip
          if-no-files-found: error
