
name: Platform Dependency Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Diagnose ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            python3-dev \
            build-essential \
            libgl1-mesa-glx \
            libegl1-mesa \
            libxkbcommon-x11-0 \
            libpulse0 \
            libasound2-dev

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install portaudio

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Test requirements individually
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          req_file = pathlib.Path("requirements.txt")
          if not req_file.exists():
              print("ERROR: requirements.txt not found")
              sys.exit(1)

          passed = []
          failed = []
          skipped = []

          lines = req_file.read_text(encoding="utf-8").splitlines()

          for number, raw in enumerate(lines, 1):
              requirement = raw.strip()

              if not requirement or requirement.startswith("#"):
                  continue

              # Handle ordinary requirement lines independently.
              # Complex pip directives need separate review.
              if requirement.startswith(("-", "--")):
                  skipped.append((number, requirement))
                  print(f"SKIP line {number}: {requirement}", flush=True)
                  continue

              print(f"\n{'=' * 60}", flush=True)
              print(f"Testing line {number}: {requirement}", flush=True)
              print(f"{'=' * 60}", flush=True)

              temp_path = None
              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      suffix=".txt",
                      encoding="utf-8",
                      delete=False,
                  ) as temp:
                      temp.write(requirement + "\n")
                      temp_path = temp.name

                  result = subprocess.run(
                      [
                          sys.executable,
                          "-m",
                          "pip",
                          "install",
                          "--disable-pip-version-check",
                          "-r",
                          temp_path,
                      ],
                      check=False,
                  )

                  if result.returncode == 0:
                      passed.append((number, requirement))
                      print(f"PASS: {requirement}", flush=True)
                  else:
                      failed.append((number, requirement, result.returncode))
                      print(
                          f"FAIL: {requirement}; continuing to next requirement",
                          flush=True,
                      )
              except Exception as exc:
                  failed.append((number, requirement, str(exc)))
                  print(f"FAIL: {requirement}: {exc}", flush=True)
              finally:
                  if temp_path:
                      pathlib.Path(temp_path).unlink(missing_ok=True)

          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write(f"## Dependency report: {sys.platform}\n\n")
              summary.write(f"- Passed: **{len(passed)}**\n")
              summary.write(f"- Failed: **{len(failed)}**\n")
              summary.write(f"- Skipped: **{len(skipped)}**\n\n")

              if failed:
                  summary.write("### Failed requirements\n\n")
                  for number, requirement, error in failed:
                      summary.write(
                          f"- Line {number}: `{requirement}` — `{error}`\n"
                      )

              if skipped:
                  summary.write("\n### Skipped entries\n\n")
                  for number, requirement in skipped:
                      summary.write(
                          f"- Line {number}: `{requirement}`\n"
                      )

              if not failed:
                  summary.write("No individual requirement installations failed.\n")

          print("\n========== FINAL SUMMARY ==========")
          print(f"Passed: {len(passed)}")
          print(f"Failed: {len(failed)}")
          print(f"Skipped: {len(skipped)}")

          for number, requirement, error in failed:
              print(f"FAILED line {number}: {requirement} ({error})")

          # Do not fail this diagnostic job just because one package failed.
          # The summary and logs retain the failure information.
          PY

      - name: Show Python and pip versions
        if: always()
        run: |
          python --version
          python -m pip --version
