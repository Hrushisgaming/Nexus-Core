name: Build Nexus Core for macOS (.dmg)

# Run this one OS on its own (Actions > this workflow > Run workflow),
# or let "Build Multi-Platform Installers" call it.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos:
    name: Build macOS Application (.dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify Runner
        run: |
          uname -m
          python --version
          python -c "import platform; print('Architecture:', platform.machine())"

      - name: Install System Dependencies
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          brew list portaudio >/dev/null 2>&1 || brew install portaudio

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify modules compile and import
        run: |
          python -m py_compile main.py ui.py core/platform_api.py core/window_context.py core/sensorium.py core/protocols.py core/user_paths.py core/updater_ota.py actions/game_updater.py
          python - <<'PY'
          import core.platform_api
          import core.window_context
          import core.sensorium
          import core.protocols
          import core.user_paths
          import core.updater_ota
          import actions.game_updater
          print('All modules import OK')
          PY

      - name: Build macOS App + DMG
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: NexusCore-macOS-DMG
          path: dist/*.dmg
          if-no-files-found: error
