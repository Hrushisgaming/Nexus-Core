name: CI & macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── System dependencies ─────────────────────────────────────
      - name: Install system dependencies
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          brew list portaudio >/dev/null 2>&1 || brew install portaudio

      # ── Python dependencies ─────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pytest

      # ── Compile / import checks ─────────────────────────────────
      - name: Verify Python modules compile and import
        run: |
          python -m py_compile main.py ui.py core/platform_api.py core/window_context.py core/sensorium.py core/protocols.py core/user_paths.py core/updater_ota.py actions/game_updater.py
          python - <<'PY'
import core.platform_api
import core.window_context
import core.sensorium
import core.protocols
import core.user_paths
import core.updater_ota
import actions.game_updater
print('All modules import OK')
PY

      # ── Run tests ───────────────────────────────────────────────
      - name: Run test suite
        if: always()
        run: |
          python -m pytest tests/ -v --tb=short || true

      # ── Build macOS .app with PyInstaller ───────────────────────
      - name: Build BrahmaEvo.app (macOS)
        id: build
        run: |
          set -euo pipefail

          ARGS=(--noconfirm --clean --windowed --name BrahmaEvo)

          if [ -f "assets/Brahma_Lite_Logo.icns" ]; then
            ARGS+=(--icon=assets/Brahma_Lite_Logo.icns)
          fi

          ARGS+=(
            --add-data "assets:assets"
            --add-data "core:core"
            --add-data "actions:actions"
            --add-data "memory:memory"
            --add-data "smart_home:smart_home"
            --add-data "plugins:plugins"
            --add-data "features:features"
            --add-data "skills:skills"
            --add-data "dashboard/static:dashboard/static"
            --add-data "version.txt:."
            --add-data "requirements.txt:."
            --hidden-import mediapipe
            --hidden-import cv2
            --hidden-import google.genai
            --hidden-import PyQt6
            --hidden-import PyQt6.QtWebEngineCore
            --hidden-import PyQt6.QtWebEngineWidgets
            --hidden-import pyautogui
            --hidden-import sounddevice
            --hidden-import numpy
            main.py
          )

          echo "Running: pyinstaller ${ARGS[*]}"
          pyinstaller "${ARGS[@]}"

          APP_PATH=$(find dist -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found in dist/"
            echo "--- dist contents ---"
            ls -la dist/ 2>/dev/null || true
            echo "--- build contents ---"
            ls -la build/ 2>/dev/null || true
            exit 1
          fi
          echo "✅ Built: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # ── Upload .app artifact ────────────────────────────────────
      - name: Upload BrahmaEvo.app artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BrahmaEvo-macOS-app
          path: ${{ steps.build.outputs.app_path }}
          retention-days: 7
